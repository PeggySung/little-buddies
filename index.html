  // 在畫面出現前先套用深淺色，避免閃一下

</script>
<style>
/* ───────── 色彩與字體（規格見 整體規劃.md 附錄） ───────── */
:root {
  --bg:#F7F4EC; --card:#FFFDF8; --sunk:#EFE9DC;
  --ink:#24324A; --ink2:#4F5B6E; --ink3:#5F6A7C;
  --line:rgba(36,50,74,.14); --line2:rgba(36,50,74,.32);
  --pri:#F2B33D; --on-pri:#3A2800;
  --acc:#F2B33D; --acc-soft:#FBEBC4; --acc-ink:#5A3C00; --sel-ink:#24324A;
  --stamp:#B4532F; --danger:#B42318; --danger-soft:#FDE8E6;
  --shadow:3px 4px 0 rgba(36,50,74,.10);
  --f-title:"Huninn","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,sans-serif;
  --f-num:"Nunito","Noto Sans TC",system-ui,sans-serif;
  --r-card:18px 22px 17px 21px / 21px 17px 22px 18px;
  --r-card2:21px 17px 22px 18px / 18px 22px 17px 21px;
  --r-btn:14px 16px 13px 15px / 15px 13px 16px 14px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg:#121821; --card:#1B2330; --sunk:#242E3D;
  --ink:#EEE8DC; --ink2:#B6BDC8; --ink3:#A0A8B4;
  --line:rgba(238,232,220,.12); --line2:rgba(238,232,220,.28);
  --pri:#F5C15A; --on-pri:#241A03;
  --acc:#F5C15A; --acc-soft:rgba(245,193,90,.16); --acc-ink:#F7CF7A; --sel-ink:#F7CF7A;
  --stamp:#F0A07A; --danger:#FF8A80; --danger-soft:rgba(255,138,128,.14);
  --shadow:3px 4px 0 rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; min-height: 100dvh; }
/* 捲軸位置永遠先留好：內容長短不同時，整頁寬度不變，畫面不會左右跳 */
html { scrollbar-gutter: stable; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
.hidden { display: none !important; }
.wrap { max-width: 520px; margin: 0 auto; padding: calc(14px + var(--safe-t)) 18px calc(28px + var(--safe-b)); display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { margin: 0; font-weight: 400; }
.title { font-family: var(--f-title); }
.num { font-family: var(--f-num); font-weight: 800; }
.muted { color: var(--ink2); } .faint { color: var(--ink3); }
.small { font-size: 13.5px; line-height: 1.6; } .tiny { font-size: 12px; line-height: 1.5; }

/* 頂部列 */
.top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; gap: 8px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand img { width: 36px; height: 36px; border-radius: 10px; }
.brand span { font-family: var(--f-title); font-size: 20px; }
.iconbtn { width: 44px; height: 44px; border: 0; background: transparent; color: var(--ink2); display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; padding: 0; text-decoration: none; }
.iconbtn:hover { background: var(--sunk); }

/* 卡片與按鈕 */
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.btn { min-height: 48px; padding: 0 18px; border-radius: var(--r-btn); border: 1.5px solid var(--line2); background: transparent; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn.pri { background: var(--pri); color: var(--on-pri); border-color: transparent; box-shadow: var(--shadow); font-family: var(--f-title); font-weight: 400; font-size: 17px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.gbtn { min-height: 52px; width: 100%; max-width: 320px; margin: 0 auto; border-radius: var(--r-btn); border: 1.5px solid var(--line2); background: var(--card); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow); }
.dash { height: 0; border-top: 1.5px dashed var(--line2); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--acc-soft); color: var(--acc-ink); }

/* 頭像：代表色外框＋淡色底 */
.av { --s: 40px; width: var(--s); height: var(--s); border-radius: 50%; flex-shrink: 0; border: 2.5px solid var(--c, var(--ink3)); background: var(--cs, var(--sunk)); display: inline-flex; align-items: center; justify-content: center; overflow: hidden; font-weight: 700; font-size: calc(var(--s) * .4); color: var(--ink); position: relative; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av.xl { --s: 96px; border-width: 4px; }
.av.lg { --s: 64px; border-width: 3px; }
.av.sm { --s: 30px; border-width: 2px; }
.av.hd { --s: 36px; border-width: 2.5px; }
.stack { display: flex; }
.stack .av { box-shadow: 0 0 0 2px var(--card); margin-right: -6px; }
.av.more { font-size: 11px; font-family: var(--f-num); background: var(--sunk); border-color: var(--line2); }

/* 旅程 */
.trip { text-decoration: none; color: var(--ink); }
.trip-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.stamp { --s: 72px; width: var(--s); height: var(--s); flex-shrink: 0; border-radius: 50%; border: 2px solid var(--stamp); color: var(--stamp); padding: calc(var(--s) * .055); box-sizing: border-box; opacity: .92; }
.stamp > div { width: 100%; height: 100%; border-radius: 50%; border: 1px dashed var(--stamp); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.stamp b { font-size: calc(var(--s) * .12); letter-spacing: .06em; line-height: 1.2; white-space: nowrap; max-width: 86%; overflow: hidden; }
.stamp span { font-size: calc(var(--s) * .22); line-height: 1.15; white-space: nowrap; max-width: 78%; text-align: center; }
.stamp span.two { white-space: normal; word-break: break-word; overflow-wrap: anywhere; line-height: 1.1; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin: 1px 0; }
.stamp i { font-style: normal; font-size: calc(var(--s) * .12); font-weight: 700; }
.tm-list { display: flex; flex-direction: column; gap: 10px; }
.tm-row { display: flex; gap: 10px; align-items: center; }
.tm-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tm-main .bar { height: 6px; }
.t24 { display: flex; align-items: center; gap: 2px; padding: 0 6px; }
.t24 select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 17px; font-variant-numeric: tabular-nums; padding: 10px 6px; min-width: 0; flex: 1; text-align: center; text-align-last: center; border-radius: 8px; cursor: pointer; }
.t24 select:focus-visible { outline: 2px solid var(--acc); }
.t24 span { font-weight: 700; color: var(--ink3); }
.t24.empty select { color: var(--ink3); }
.t24:focus-within { border-color: var(--acc); }
.sec-h.fold { display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: 0; padding: 6px 2px; text-align: left; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink3); letter-spacing: 1px; }
.sec-h.fold svg { transition: transform .2s; flex-shrink: 0; }
.sec-h.fold[aria-expanded="false"] svg { transform: rotate(-90deg); }
.sec-h.fold .ok { color: var(--acc-ink, var(--ink2)); }
.fold-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -2px 2px -6px; }
.fold-bar > span { font-size: 13px; font-weight: 700; color: var(--ink3); letter-spacing: 1px; }
.fold-all { position: relative; display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 0 12px 0 9px; border: 0; border-radius: 999px; background: var(--sunk); color: var(--ink2); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.fold-all::after { content: ""; position: absolute; inset: -6px -4px; }
.fold-all:hover { background: var(--line); }
.fold-all:focus-visible { outline: 2.5px solid var(--acc); outline-offset: 2px; }
/* ───────── 記帳 ───────── */
:root { --ok:#1F7A4D; --pos:#1F7A4D; --neg:#B42318; }
[data-theme="dark"] { --ok:#6FD3A0; --pos:#6FD3A0; --neg:#FF8A80; }
.fab { position: fixed; right: max(18px, calc(50vw - 260px + 18px)); bottom: calc(84px + var(--safe-b)); z-index: 25; width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--pri); color: var(--on-pri); box-shadow: 0 6px 16px rgba(36,50,74,.22); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.fab svg { width: 28px; height: 28px; }
.fab:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.wrap.has-fab { padding-bottom: calc(170px + var(--safe-b)); }
.cur-badge { display: inline-block; font-family: var(--f-num); font-size: 11px; font-weight: 800; letter-spacing: .5px; padding: 2px 7px; border-radius: 6px; background: var(--sunk); color: var(--ink2); vertical-align: 2px; }
.mn-sum { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.mn-sum b { font-size: 22px; }
.mn-filter { display: flex; gap: 8px; flex-wrap: wrap; }
.pillbtn { min-height: 36px; padding: 4px 14px; border-radius: 999px; border: 1.5px solid var(--line2); background: var(--card); color: var(--ink2); font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; }
.pillbtn[aria-pressed="true"] { background: var(--acc-soft); border-color: var(--acc); color: var(--sel-ink); }
.pillbtn:disabled { opacity: .5; cursor: default; }
.mn-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px; border: 0; border-top: 1.5px dashed var(--line); background: none; color: var(--ink); text-align: left; cursor: pointer; font: inherit; }
.mn-row:first-child { border-top: 0; }
.mn-row:focus-visible { outline: 2.5px solid var(--acc); outline-offset: -3px; }
.mn-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.mn-name { font-weight: 700; overflow-wrap: anywhere; }
.mn-amt { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
.mn-main .stack { margin-right: 6px; }
.tag { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--sunk); color: var(--ink2); }
.tag svg { width: 11px; height: 11px; }
.kind.other svg { width: 18px; height: 18px; }
.kind.xs { width: 24px; height: 24px; }
.kind.xs .kmask { width: 16px; height: 16px; }
.kind.xs .ksvg { width: 15px; height: 15px; }
.kind.xs svg { width: 14px; height: 14px; }
.cat-pick { display: flex; gap: 8px; flex-wrap: wrap; }
.cat { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 6px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--ink2); font-weight: 700; font-size: 14px; cursor: pointer; }
.cat[aria-pressed="true"] { background: var(--acc-soft); border-color: var(--acc); color: var(--sel-ink); }
#eCurSeg { grid-auto-flow: row; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
#eCurSeg select { min-height: 46px; width: 92px; font-size: 14px; font-weight: 700; color: var(--ink2); padding: 0 28px 0 14px; background-position: right 10px center; text-overflow: clip; }
#eCurSeg select.on { background-color: var(--acc-soft); border-color: var(--acc); color: var(--sel-ink); }
.input.big { font-size: 24px; min-height: 56px; font-weight: 700; }
.amt-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.amt-row { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 9em); align-items: center; gap: 8px; }

details.more { border: 1.5px solid var(--line); border-radius: 14px; padding: 0 14px; }

details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "＋"; margin-right: 8px; color: var(--ink3); }

.more-body { display: flex; flex-direction: column; gap: 16px; padding-bottom: 14px; }
.px-line { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1.5px dashed var(--line2); border-radius: 12px; }
.px-line .field { gap: 4px; }
.px-client { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1.5px dashed var(--line); }
.lock-note { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--acc-soft); color: var(--sel-ink); font-size: 13px; }
.lock-note svg { flex-shrink: 0; margin-top: 2px; }
.bal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(66px, 1fr)); gap: 10px 4px; }
.bal-grid > div { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; text-align: center; }
.bal-grid .tiny { max-width: 100%; }
.pos { color: var(--pos); font-weight: 800; } .neg { color: var(--neg); font-weight: 800; }
.tr-list { display: flex; flex-direction: column; gap: 8px; }
.tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "flow flow" "amt btn"; align-items: center; gap: 6px 8px; padding: 10px 12px; border-radius: 12px; background: var(--sunk); }
.tr .tr-flow { grid-area: flow; } .tr > b { grid-area: amt; font-size: 17px; } .tr > .pillbtn { grid-area: btn; }
.tr.paid { opacity: .6; }
.tr-flow { display: flex; align-items: center; gap: 5px; min-width: 0; flex-wrap: wrap; }
.tr-flow > span { white-space: nowrap; }
.itgo { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px dashed var(--line2); background: var(--card); color: var(--ink); font: inherit; font-weight: 700; text-align: left; cursor: pointer; }

.itgo.on { border-style: solid; align-items: center; color: var(--ink2); min-height: 44px; padding: 8px 14px; }

.rc { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: var(--sunk); }
.sheet:focus { outline: none; }
.rc-lines { display: flex; flex-direction: column; gap: 10px; }
.rc-line { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); }
.rc-top { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 7.5em) auto; gap: 6px; align-items: center; }

.rc-price { text-align: right; font-weight: 700; }
.rc-no { font-family: var(--f-num); font-size: 12px; font-weight: 800; color: var(--ink3); min-width: 1.4em; text-align: center; }
.rc-who { display: flex; gap: 6px; flex-wrap: wrap; }
.rc-chip { min-height: 36px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px 2px 3px; border-radius: 999px; border: 1.5px solid var(--line2); background: var(--card); color: var(--ink2); font-size: 13px; font-weight: 700; cursor: pointer; }
.rc-chip[data-rpx] { padding-left: 10px; }

.rc-qty { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.rc-qty .input { width: 3.4em; min-height: 36px; padding: 0 6px; text-align: center; }
.rc-opts { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; border-top: 1.5px dashed var(--line); }
.rc-cost:empty { display: none; }
.input.rc-rate { width: 4em; min-height: 36px; padding: 0 6px; text-align: center; }
.rc-sum { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; background: var(--card); }
.hidden { display: none !important; }
.dlg-bg { position: fixed; inset: 0; z-index: 70; background: rgba(10, 14, 20, .45); display: flex; align-items: center; justify-content: center; padding: 18px; }
.dlg { width: 100%; max-width: 420px; max-height: 88dvh; overflow-y: auto; background: var(--bg); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 12px 32px rgba(10,14,20,.25); }
.nowrap { white-space: nowrap; }
.cl-meta { line-height: 1.8; }
.cl-meta .av { display: inline-flex; vertical-align: middle; }

.imp-list { display: flex; flex-direction: column; gap: 6px; }
.imp { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); cursor: pointer; }

.cl-row:first-of-type { border-top: 0; }

.sh-name { font-weight: 700; overflow-wrap: anywhere; }

.dur-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.dur-chips .btn { min-width: 44px; padding: 0 10px; font-family: var(--f-num); }
.dur-chips .btn[aria-pressed="true"] { background: var(--acc-soft); border-color: var(--acc); color: var(--sel-ink); }
.input { min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line2); background: var(--card); font-size: 16px; width: 100%; }
.btn:focus-visible, .opt:focus-visible, .seg button:focus-visible, .iconbtn:focus-visible { outline: 2.5px solid var(--acc); outline-offset: 2px; }
/* 輸入框聚焦：直接把原本的框變成黃色加粗，不另外在外面畫一圈 */
.input:focus, .t24:focus-within { outline: none; border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
.t24 select:focus-visible { outline: none; background: var(--acc-soft); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.seg button { min-height: 46px; border-radius: var(--r-btn); border: 2px solid var(--line); background: var(--card); color: var(--ink2); font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; }
.seg button[aria-pressed="true"] { background: var(--acc-soft); border-color: var(--acc); color: var(--sel-ink); }

/* 測驗 */
.progress { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; flex: 1; }
.progress i { height: 6px; border-radius: 999px; background: var(--line2); }
.progress i.on { background: var(--acc); }
.opt { min-height: 60px; width: 100%; display: flex; align-items: center; gap: 14px; padding: 10px 14px; text-align: left; border-radius: var(--r-card); border: 1.5px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; font-size: 15px; line-height: 1.45; }
.opt[aria-checked="true"] { border: 2.5px solid var(--oc, var(--acc)); box-shadow: var(--shadow); }
.opt .oi { width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; background: var(--ot, var(--sunk)); color: var(--oc, var(--ink2)); display: flex; align-items: center; justify-content: center; }
.opt .tick { width: 24px; height: 24px; border-radius: 50%; background: var(--acc); color: var(--on-pri); display: none; align-items: center; justify-content: center; flex-shrink: 0; }
.opt[aria-checked="true"] .tick { display: flex; }
.swatch { height: 64px; border-radius: var(--r-btn); border: 1.5px solid var(--line); }
input[type=range] { width: 100%; accent-color: var(--acc); }

/* 登入畫面 */
.gate { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 32px 22px calc(32px + var(--safe-b)); text-align: center; max-width: 440px; margin: 0 auto; }
.gate .logo { width: 168px; height: 168px; border-radius: 36px; box-shadow: var(--shadow); }
.gate h1 { font-family: var(--f-title); font-size: 30px; }
.gate .en { font-family: var(--f-num); font-weight: 800; letter-spacing: 3px; font-size: 13px; color: var(--stamp); }
.gate .card { text-align: left; width: 100%; }
.warn { background: var(--danger-soft); color: var(--danger); border-radius: 12px; padding: 10px 14px; font-size: 14px; }

.row { display: flex; align-items: center; gap: 12px; }
.list-row { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.list-row .k { color: var(--ink2); font-size: 14px; width: 112px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
#toast { position: fixed; left: 50%; bottom: calc(92px + var(--safe-b)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; z-index: 99; max-width: 90vw; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line2); border-top-color: var(--acc); animation: spin 0.8s linear infinite; }
/* ───────── 分頁切換動畫 ───────── */
@keyframes tabslide { from { transform: translateX(var(--tx, 0)) scaleX(var(--ts, 1)); } to { transform: none; } }
.ttabs button.slid::before, .utabs button.slid::after { animation: tabslide .28s cubic-bezier(.3,.7,.3,1); }
@keyframes tabin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.tab-in { animation: tabin .22s ease-out both; }
.tabbar .pill.slid::before { animation: tabslide .3s cubic-bezier(.3,.7,.3,1); }
@keyframes tabpop { 0% { transform: scale(.82); } 60% { transform: scale(1.08); } 100% { transform: none; } }
.tabbar .pill.slid svg { animation: tabpop .3s ease-out; }
@keyframes daypick { from { background: var(--card); border-color: var(--line); color: var(--ink2); } }
@keyframes dayunpick { from { background: var(--acc-soft); border-color: var(--acc); color: var(--sel-ink); } }
.daychip.picked { animation: daypick .25s ease-out; }
/* 彈出視窗：灰色背景淡入、面板從下面滑上來；關閉時反過來 */
@keyframes fadein { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes sheetup { from { transform: translateY(100%); } }
@keyframes sheetdown { to { transform: translateY(100%); } }
@keyframes dlgin { from { opacity: 0; transform: scale(.94); } }
@keyframes dlgout { to { opacity: 0; transform: scale(.96); } }
.sheet-bg { animation: fadein .22s ease-out; }
.sheet-bg .sheet { animation: sheetup .32s cubic-bezier(.2,.8,.25,1); }
.sheet-bg.out { animation: fadeout .22s ease-in forwards; pointer-events: none; }
.sheet-bg.out .sheet { animation: sheetdown .22s ease-in forwards; }
.dlg-bg { animation: fadein .18s ease-out; }
.dlg-bg .dlg { animation: dlgin .2s cubic-bezier(.2,.8,.25,1); }
.dlg-bg.out { animation: fadeout .16s ease-in forwards; pointer-events: none; }
.dlg-bg.out .dlg { animation: dlgout .16s ease-in forwards; }
.daychip.unpicked { animation: dayunpick .25s ease-out; }
@media (prefers-reduced-motion: reduce) { .ttabs button.slid::before, .utabs button.slid::after, .tab-in, .tabbar .pill.slid::before, .tabbar .pill.slid svg, .daychip.picked, .daychip.unpicked, .sheet-bg, .sheet-bg .sheet, .dlg-bg, .dlg-bg .dlg { animation: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } #toast { transition: none; } }

/* ───────── 天氣背景（我的 → 背景天氣動畫，預設關閉；只在旅程頁顯示） ───────── */
#wxbg { display: none; position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: var(--bg); }
html.wxbg #wxbg { display: block; }
html.wxbg body { background: transparent; }
html.wxbg #main { position: relative; z-index: 1; }
#wxbg > div { position: absolute; }
.wb-sky, .wb-tint, .wb-fall, .wb-flash { inset: 0; }
.wb-sky i { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
.wb-sky i.on { opacity: 1; }
.p-dawn { background: linear-gradient(180deg, #F6CDB8 0%, #F8E3D2 34%, #F7F4EC 72%); }
.p-day { background: linear-gradient(180deg, #BFE0F0 0%, #DDEEF0 36%, #F7F4EC 74%); }
.p-dusk { background: linear-gradient(180deg, #EE9F86 0%, #E9BFB8 30%, #E8DCDF 60%, #F1EBE6 85%); }
.p-night { background: linear-gradient(180deg, #B9C0D6 0%, #D6D7E3 38%, #EEEBE8 78%); } /* 淺色模式的夜晚：柔和藍灰，字才看得清楚 */
[data-theme="dark"] .p-dawn { background: linear-gradient(180deg, #5A3A3A 0%, #2E2B33 45%, #121821 80%); }
[data-theme="dark"] .p-day { background: linear-gradient(180deg, #24415A 0%, #1A2636 45%, #121821 80%); }
[data-theme="dark"] .p-dusk { background: linear-gradient(180deg, #5C3034 0%, #33263A 45%, #141824 80%); }
[data-theme="dark"] .p-night { background: linear-gradient(180deg, #070B16 0%, #0E1424 50%, #121821 100%); }
.wb-tint { opacity: 0; transition: opacity 1.2s ease, background 1.2s ease; }
/* 淺色模式：陰天、雨天、霧天、雷雨、下雪各有自己的天空漸層（不再疊灰色，顏色才不會髒） */
html:not([data-theme="dark"]) #wxbg.wx-cloudy .p-dawn, html:not([data-theme="dark"]) #wxbg.wx-rain .p-dawn { background: linear-gradient(180deg, #E6D6D0 0%, #EEE6E1 38%, #F5F2EE 75%); }
html:not([data-theme="dark"]) #wxbg.wx-cloudy .p-day, html:not([data-theme="dark"]) #wxbg.wx-rain .p-day { background: linear-gradient(180deg, #CFDCE5 0%, #E3E9ED 38%, #F4F3EF 75%); }
html:not([data-theme="dark"]) #wxbg.wx-cloudy .p-dusk, html:not([data-theme="dark"]) #wxbg.wx-rain .p-dusk { background: linear-gradient(180deg, #DCC9CC 0%, #E8DDE0 38%, #F3EEEC 75%); }
html:not([data-theme="dark"]) #wxbg.wx-cloudy .p-night, html:not([data-theme="dark"]) #wxbg.wx-rain .p-night { background: linear-gradient(180deg, #BCC3CF 0%, #D5D9E0 40%, #EDECEA 80%); }
html:not([data-theme="dark"]) #wxbg.wx-mist .p-dawn { background: linear-gradient(180deg, #EFE6E2 0%, #F4F0EC 40%, #F7F5F1 75%); }
html:not([data-theme="dark"]) #wxbg.wx-mist .p-day { background: linear-gradient(180deg, #E3E9EC 0%, #EEF1F2 40%, #F7F6F3 75%); }
html:not([data-theme="dark"]) #wxbg.wx-mist .p-dusk { background: linear-gradient(180deg, #EBE2E2 0%, #F2EDEC 40%, #F7F4F1 75%); }
html:not([data-theme="dark"]) #wxbg.wx-mist .p-night { background: linear-gradient(180deg, #D3D7DE 0%, #E3E5E8 40%, #F1F0EE 80%); }
html:not([data-theme="dark"]) #wxbg.wx-storm .p-dawn { background: linear-gradient(180deg, #BFB3B6 0%, #D9D2D3 40%, #F1EEEB 80%); }
html:not([data-theme="dark"]) #wxbg.wx-storm .p-day { background: linear-gradient(180deg, #A9B8C6 0%, #CDD6DD 40%, #F0F0ED 80%); }
html:not([data-theme="dark"]) #wxbg.wx-storm .p-dusk { background: linear-gradient(180deg, #B7A9B0 0%, #D5CCD0 40%, #F0ECEA 80%); }
html:not([data-theme="dark"]) #wxbg.wx-storm .p-night { background: linear-gradient(180deg, #A3ABBC 0%, #C6CBD5 42%, #EAE9E8 85%); }
html:not([data-theme="dark"]) #wxbg.wx-snow .p-dawn { background: linear-gradient(180deg, #EADDE0 0%, #F1ECEE 38%, #F7F6F3 75%); }
html:not([data-theme="dark"]) #wxbg.wx-snow .p-day { background: linear-gradient(180deg, #D6E6F0 0%, #E9F1F5 38%, #F7F7F4 75%); }
html:not([data-theme="dark"]) #wxbg.wx-snow .p-dusk { background: linear-gradient(180deg, #E2D4DC 0%, #EDE6EA 38%, #F6F3F1 75%); }
html:not([data-theme="dark"]) #wxbg.wx-snow .p-night { background: linear-gradient(180deg, #C7CFDD 0%, #DDE2EA 40%, #F1F1F0 80%); }
/* 深色模式：維持原本的做法，疊一層深色色調 */
[data-theme="dark"] #wxbg.wx-cloudy .wb-tint, [data-theme="dark"] #wxbg.wx-rain .wb-tint, [data-theme="dark"] #wxbg.wx-mist .wb-tint { opacity: 1; background: rgba(40,46,56,.35); }
[data-theme="dark"] #wxbg.wx-storm .wb-tint { opacity: 1; background: rgba(20,24,32,.45); }
[data-theme="dark"] #wxbg.wx-snow .wb-tint { opacity: 1; background: rgba(120,140,170,.18); }
.wb-deco { top: calc(var(--safe-t) - 40px); right: calc(max(0px, 50vw - 260px) - 52px); width: 170px; height: 170px; opacity: 0; transition: opacity .6s ease; }
.wb-fall { opacity: 0; transition: opacity .8s ease; }
#wxbg.anim .wb-deco { opacity: .82; }
#wxbg.anim .wb-fall { opacity: 1; }
.wb-fog { left: -40%; right: -40%; top: 30%; height: 45%; opacity: 0; transition: opacity 1s; background: radial-gradient(closest-side, rgba(255,255,255,.75), rgba(255,255,255,0)); filter: blur(8px); }
[data-theme="dark"] .wb-fog { background: radial-gradient(closest-side, rgba(200,210,225,.18), rgba(200,210,225,0)); }
#wxbg.anim.wx-mist .wb-fog { opacity: 1; animation: wbDrift 18s ease-in-out infinite alternate; }
.wb-flash { background: #fff; opacity: 0; }
#wxbg.anim.wx-storm .wb-flash { animation: wbFlash 7s infinite; }
@keyframes wbFlash { 0%, 90%, 94%, 100% { opacity: 0; } 91% { opacity: .55; } 92% { opacity: .08; } 93% { opacity: .4; } }
@keyframes wbDrift { from { transform: translateX(-12%); } to { transform: translateX(12%); } }
@media (prefers-reduced-motion: reduce) { .wb-sky i, .wb-tint { transition: none; } #wxbg .wb-fog, #wxbg .wb-flash { animation: none !important; } }

/* 行程頁：天氣小卡（日出日落、潮汐） */
.wxrow { flex: 1; min-width: 0; display: flex; align-items: center; } /* 跟 Day 1 同一行的天氣小字 */
.wxchip { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; min-width: 0; min-height: 32px; padding: 2px 6px; margin-left: -2px; border: 0; border-radius: 8px; background: none; color: var(--ink3); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
.wxchip:hover { background: var(--sunk); }
.wxchip.off { cursor: default; }
.wxchip.off:hover { background: none; }
.wxinfo { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wxchip .num { font-family: var(--f-num); font-weight: 700; }
.wxchip svg { flex: none; }
.wxchip > svg:last-child { opacity: .7; transition: transform .2s; }
.wxchip[aria-expanded="true"] > svg:last-child { transform: rotate(180deg); }
.wxchip:focus-visible { outline: 2.5px solid var(--acc); outline-offset: 2px; }
.wxcard[hidden] { display: none; }
.wxcard { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px; margin-top: -6px; }
.wxcard h3 { font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.wxcard h3 small { font-weight: 500; font-size: 11.5px; color: var(--ink3); }
.wxcard svg { display: block; width: 100%; height: auto; overflow: visible; }
.wxcard .lbls { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink2); margin-top: 2px; }
.wxcard .lbls .num { font-family: var(--f-num); font-weight: 800; color: var(--ink); font-size: 13.5px; }
.wxstats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } /* 天氣卡片：體感、降雨、風、紫外線 */
.wxstats > div { background: var(--sunk); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wxstats span { font-size: 11.5px; color: var(--ink3); }
.wxstats b { font-size: 14.5px; color: var(--ink); line-height: 1.35; }
.wxstats b small { display: block; font-size: 11.5px; font-weight: 500; color: var(--ink2); }
.wxstats .num { font-family: var(--f-num); font-weight: 800; }
.wxstats .wide { grid-column: 1 / -1; }
.wxstats .warn { background: var(--danger-soft); }
.wxstats .warn b { color: var(--danger); }
.wxcard hr { border: 0; border-top: 1.5px dashed var(--line); margin: 0; }
.tides { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 4px; text-align: center; font-size: 11px; color: var(--ink3); }
.tides b { display: block; font-size: 13.5px; color: var(--ink); }
.tides .hi b { color: var(--acc-ink); }

/* 我的：背景天氣動畫（三段切換） */
.seg3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 999px; background: #ECE6D9; }
.seg3 button { min-height: 42px; border: 0; border-radius: 999px; background: none; color: var(--ink3); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .15s, color .15s; }
.seg3 button[aria-pressed="true"] { background: #FFFFFF; color: var(--ink); box-shadow: 0 1px 2px rgba(36,50,74,.10), 0 2px 6px rgba(36,50,74,.06); }
.seg3 button:focus-visible { outline: 2.5px solid var(--acc); outline-offset: 1px; }
[data-theme="dark"] .seg3 { background: var(--sunk); }
[data-theme="dark"] .seg3 button[aria-pressed="true"] { background: #2A3444; box-shadow: none; }
</style>
</head>
